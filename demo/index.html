<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo Bachata Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Inter+Tight:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/telefono.css">
<link rel="stylesheet" href="css/flujo.css">
<link rel="stylesheet" href="css/paneles.css">
<link rel="stylesheet" href="css/web.css">
</head>
<body>
<div class="viewport"><div class="stage" id="stage">

<header class="top">
  <img class="logo" src="img/logo.png" alt="Bachata Studio, Ritmos Latinos">
  <h1>Asistente de ventas</h1>
  <div class="seg scns" id="scns" role="group" aria-label="Escenarios"></div>
  <div class="clock" id="clock" title="Reloj de la demo"><span class="d" id="clockD">–</span><span class="t" id="clockT">–</span></div>
  <div class="ctrls">
    <button class="cbtn" id="btnFF" title="Adelantar el reloj al siguiente envío programado (F)">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 6l8 6-8 6zM12 6l8 6-8 6z"/></svg>Adelantar</button>
    <button class="cbtn" id="btnAuto" title="Reproducir el escenario solo">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5l12 7-12 7z"/></svg><span>Auto</span></button>
    <button class="cbtn primary" id="btnNext" title="Siguiente paso (Espacio)">Siguiente</button>
    <button class="cbtn icon" id="btnReset" title="Reiniciar" aria-label="Reiniciar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4"/></svg></button>
  </div>
</header>

<main class="main">

  <section aria-label="WhatsApp del prospecto">
    <div class="phone">
      <div class="screen">
        <div class="sbar"><span id="sbTime">9:41</span><span class="ic">
          <svg width="17" height="11" viewBox="0 0 17 11" fill="#000"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
          <svg width="15" height="11" viewBox="0 0 15 11" fill="#000"><path d="M7.5 2.2c2.1 0 4 .8 5.5 2.2l1.1-1.1A9.3 9.3 0 0 0 7.5.6 9.3 9.3 0 0 0 .9 3.3L2 4.4a7.7 7.7 0 0 1 5.5-2.2zm0 3.2c1.2 0 2.3.5 3.2 1.3l1.1-1.1a6.1 6.1 0 0 0-8.6 0l1.1 1.1c.9-.8 2-1.3 3.2-1.3zm0 3.2c.4 0 .8.2 1.1.4L7.5 10.1 6.4 9c.3-.2.7-.4 1.1-.4z"/></svg>
          <svg width="25" height="12" viewBox="0 0 25 12"><rect x=".5" y=".5" width="21" height="11" rx="3" fill="none" stroke="#000" opacity=".4"/><rect x="2" y="2" width="16" height="8" rx="1.6" fill="#000"/><rect x="22.5" y="4" width="1.6" height="4" rx=".8" fill="#000" opacity=".4"/></svg></span></div>
        <div class="wa-h">
          <svg class="back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>
          <div class="wa-av"><img src="img/marca.png" alt=""></div>
          <div><b>Bachata Studio <svg viewBox="0 0 24 24"><path fill="#00A884" d="M12 1.5l2.6 1.9 3.2-.1 1 3 2.6 1.9-1 3.1 1 3.1-2.6 1.9-1 3-3.2-.1L12 22.5l-2.6-1.9-3.2.1-1-3L2.6 15.8l1-3.1-1-3.1 2.6-1.9 1-3 3.2.1z"/><path d="M8 12.2l2.7 2.7L16.3 9" fill="none" stroke="#fff" stroke-width="2"/></svg></b><small id="leadLbl">Cuenta de empresa</small></div>
        </div>
        <div class="wa-chat" id="waChat" aria-live="polite"></div>
        <div class="web" id="webView"></div>
        <div class="mp" id="mpView" hidden></div>
        <button class="fab" id="waFab" type="button" aria-label="Abrir WhatsApp"><svg viewBox="0 0 24 24"><path fill="#fff" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.2 14.1c-.2.6-1.2 1.2-1.7 1.2-.4.1-1 .1-1.6-.1-3-1.2-4.9-4.2-5.1-4.4-.1-.2-1.2-1.6-1.2-3s.8-2.1 1-2.4c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.8 1.9c.1.2.1.4 0 .6l-.4.6c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.7-.1l.9-1c.2-.3.4-.2.6-.1l1.8.9c.3.1.5.2.5.4 0 .2 0 .7-.3 1.1z"/></svg></button>
        <form class="wa-in" id="waForm" autocomplete="off">
          <div class="box"><input id="waInput" placeholder="Escribe como prospecto" aria-label="Escribir como prospecto"></div>
          <button class="send" type="submit" aria-label="Enviar"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 20.5l18-8.5L3 3.5l2.2 7.1L14 12l-8.8 1.4z"/></svg></button>
        </form>
      </div>
    </div>
  </section>

  <section class="center" aria-label="Cómo funciona">
    <div class="panel editor">
      <div class="ed-h">
        <span class="n8n" aria-hidden="true">n8n</span>
        <div class="ed-t"><h2 id="wfName">Mensaje nuevo</h2><div class="sub" id="wfSub">–</div></div>
        <div class="seg wf-tabs" id="wfTabs" role="tablist" aria-label="Workflows"></div>
      </div>
      <div class="canvas-wrap"><div class="canvas" id="canvas"></div><span class="status" id="execMeta">Esperando un mensaje</span></div>
    </div>
    <div class="panel exec">
      <div class="ex-h"><h3>Ejecución</h3><span class="sub">Lo que hizo cada nodo, en orden</span></div>
      <ol class="log" id="log"></ol>
    </div>
  </section>

  <section class="panel" aria-label="CRM y seguimiento">
    <div class="panel-h">
      <div class="seg" id="rTabs" role="tablist" aria-label="Paneles">
        <button role="tab" data-rp="crm" aria-selected="true">Pipedrive<i class="badge" id="bdg-crm"></i></button>
        <button role="tab" data-rp="seg" aria-selected="false">Seguimientos<i class="badge" id="bdg-seg"></i></button>
        <button role="tab" data-rp="owner" aria-selected="false">Alberto<i class="badge" id="bdg-owner"></i></button>
        <button role="tab" data-rp="funnel" aria-selected="false">Resultados<i class="badge" id="bdg-funnel"></i></button>
      </div>
    </div>
    <div class="pane on" id="rp-crm"></div>
    <div class="pane" id="rp-seg"></div>
    <div class="pane" id="rp-owner"></div>
    <div class="pane" id="rp-funnel"></div>
  </section>
</main>

<footer class="cap">
  <span class="app"><img src="img/marca.png" alt=""></span>
  <span class="txt" id="capTxt">–</span>
  <span class="stepn" id="capStep">–</span>
  <i class="progress" id="capProg"></i>
</footer>

</div></div>
<script src="js/config.js"></script>
<script src="js/agente.js"></script>
<script src="js/demo.js"></script>
</body>
</html>
